spring.application.name=patent
spring.config.import=optional:classpath:application-secrets.properties,optional:file:./application-local.properties,optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/patent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jackson.serialization.write-dates-as-timestamps=false

# 密钥类配置一律不留可用默认值：缺失时 JWT 每次启动生成随机密钥（旧 Token 失效），
# 未配置 admin.auth.password 时后台登录直接拒绝。
# 本地开发写入 config/application-local.properties（该文件已被 .gitignore 排除）。
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXP_MS:86400000}
admin.auth.username=${ADMIN_AUTH_USERNAME:admin}
admin.auth.password=${ADMIN_AUTH_PASSWORD:}
admin.jwt.secret=${ADMIN_JWT_SECRET:}
admin.jwt.expiration-ms=${ADMIN_JWT_EXP_MS:86400000}

search.es.enabled=${ES_ENABLED:true}
spring.elasticsearch.uris=${ES_URIS:http://localhost:9200}
spring.elasticsearch.username=${ES_USERNAME:}
spring.elasticsearch.password=${ES_PASSWORD:}
search.es.index.patent=${ES_INDEX_PATENT:patents}
search.es.prefer-ik=${ES_PREFER_IK:false}
search.es.auto-create-index=${ES_AUTO_CREATE_INDEX:true}
search.es.auto-reindex=${ES_AUTO_REINDEX:false}

# 通义千问（DashScope）凭据不提供默认值，未配置时调用会抛出明确的“未配置”错误。
# 生产环境请通过环境变量注入，切勿写入本文件。
ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
ai.dashscope.app-id=${DASHSCOPE_APP_ID:}
ai.dashscope.app-id-patent=${DASHSCOPE_APP_ID_PATENT:}
ai.dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.dashscope.model=${DASHSCOPE_MODEL:deepseek-v3.2}
ai.dashscope.timeout-ms=${DASHSCOPE_TIMEOUT_MS:60000}
